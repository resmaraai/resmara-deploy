# Render builds this repository as a *public Git URL* service, and Render
# does not auto-deploy public-URL services (see render.com/docs/deploys:
# "Services that use a prebuilt Docker image or a public Git repository URL
# must be deployed manually"). This workflow restores the missing half of the
# ship loop: every push to main calls the service's deploy hook, so a push is
# still the deploy.
#
# Which repository deploys: the *mirror* (resmaraai/resmara-deploy), because that is the Git URL
# Render builds. The source repository carries the same workflow so a push is still the whole
# ship loop from here, but its copies of the hook secret are deliberately absent — two repos
# calling one hook is two builds of the same commit. So on the source repository the job records
# a skip rather than failing: a red X on every push trains everyone to ignore the one that
# matters.
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Call the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK secret on this repository — it does not deploy."
            echo "The mirror (resmaraai/resmara-deploy) holds the hook and builds this commit."
            exit 0
          fi
          code=$(curl -s -o /tmp/hook.out -w '%{http_code}' -X POST "$HOOK")
          echo "deploy hook answered HTTP $code"
          [ "$code" = "200" ] || { cat /tmp/hook.out; exit 1; }
