# Render Blueprint — the repository is the deployment.
#
# Render reads this file, builds ./Dockerfile, creates the database, wires the connection
# string in, and redeploys on every merge to main. Anything marked sync:false is asked for
# once in the dashboard and never stored in git.
# --- Pull-request preview environments -------------------------------------------------
# One temporary copy of this stack per pull request, so a change can be clicked through on a
# real host before it is merged. This block is the declaration; it does NOT turn previews on
# by itself, and today nothing here is active. Two things have to be true first:
#
#   1. A Blueprint linked to this repo in the Render dashboard. There is none right now: the
#      live `resmara` service and `resmara-db` were created by hand in the dashboard, so Render
#      never reads this file. Until a Blueprint exists, render.yaml is documentation, not
#      configuration — and syncing one over hand-made resources is a migration, not a click
#      (it can try to create second copies of the service and database).
#   2. A Pro workspace plan ($25/mo). Hobby includes only single-service previews, which reuse
#      the production env — including DATABASE_URL — so a preview would read and write the live
#      database. Full-stack previews (their own empty database) are Pro and above.
#
# Also true when it does go live: env vars marked `sync: false` (META_CLIENT_SECRET, the engine
# keys) are NOT copied into a preview, so Meta login in a preview needs an environment group.
# `expireAfterDays: 3` deletes a preview three days after its last commit.
previews:
  generation: automatic
  expireAfterDays: 3

databases:
  - name: resmara-db
    databaseName: resmara
    user: resmara
    plan: free          # free Postgres expires 30 days after creation — see DEPLOY.md §3b
    ipAllowList: []     # private network only: the service reaches it, the internet does not.
                        # To connect from a laptop, add that IP in the dashboard.

services:
  - type: web
    name: resmara
    runtime: docker
    plan: free          # free web services sleep after ~15 min idle; see DEPLOY.md §3b
    dockerfilePath: ./Dockerfile
    healthCheckPath: /openapi.json
    autoDeployTrigger: commit   # merging to main is the deploy (autoDeploy: true is deprecated)
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resmara-db
          property: connectionString
      - key: RESMARA_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: RESMARA_PUBLISH_TOKEN
        generateValue: true
      # No RESMARA_PUBLIC_BASE_URL / META_REDIRECT_URI: the app reads RENDER_EXTERNAL_URL and
      # derives the callback from it, so the origin follows whatever host Render assigns.
      # App "Resmara" under Be Authentic Productions (verified), switched 2026-11-15. The old
      # 1881970083170197 app belongs to the previous setup and must not be used: Facebook Login for
      # Business there is not configured to issue a user token.
      - key: META_CLIENT_ID
        value: "1135911812356864"
      - key: META_CLIENT_SECRET
        sync: false     # Meta → App settings → Basic. The one value Render has to be told.
      # Reading the ad account (ads_read/read_insights), managing Page ads (pages_manage_ads) and
      # Instagram insights are new with the switch: the readiness audit and the day 7/14 report read
      # all four. Keep this list in step with the app's use cases or Meta answers Invalid Scopes.
      - key: META_SCOPES
        value: >-
          ads_management,ads_read,pages_manage_ads,read_insights,business_management,pages_read_engagement,pages_show_list,pages_manage_posts,instagram_basic,instagram_content_publish,instagram_manage_insights
      # Content engine: any OpenAI-compatible endpoint. The build box points at Ollama on
      # localhost, which a hosted instance cannot reach. Unset, the engine honestly reports
      # source="unavailable" and generates nothing; everything else keeps working.
      # - key: RESMARA_ENGINE_BASE_URL    # e.g. https://api.openai.com/v1
      #   sync: false
      # - key: RESMARA_ENGINE_API_KEY
      #   sync: false
      # - key: RESMARA_MODEL_RESEARCH     # likewise _PLAN, _BRAND, _CHECK
      #   sync: false
      # Encrypts connected ad-account tokens at rest. Left unset deliberately: an invalid value
      # makes every token write fail and Render cannot generate a valid Fernet key. Unset, the
      # app derives a stable key from SECRET_KEY. To pin it instead:
      #   python scripts/make_token_key.py  → paste the output into RESMARA_TOKEN_KEY
      # - key: RESMARA_TOKEN_KEY
      #   sync: false

  # The scheduler. Without this service nothing calls the publisher: a post can be approved
  # and scheduled and then sit there forever, because "scheduled" is a clock, and a clock
  # needs someone to look at it. Every 15 minutes this container opens the database directly
  # and publishes what is due, then exits — Render bills the run in seconds, ~$1/month floor.
  - type: cron
    name: resmara-publisher
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python scripts/publish_due.py
    schedule: "*/15 * * * *"     # UTC, Render's cron dial is UTC: 15 minutes, always
    plan: 0.5c-512mb            # cron jobs have no free plan; this is the cheapest ($1/mo floor)
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resmara-db
          property: connectionString
      - key: RESMARA_ENV
        value: production
      # A cron container has no inbound request, so PUBLIC_BASE_URL cannot be inferred here the
      # way it is in the web service. Instagram fetches post images by URL: without this the
      # media URL would name the cron job's own host and every photo post would fail.
      - key: RESMARA_PUBLIC_BASE_URL
        value: https://www.resmara.com
      # Ad-account tokens are encrypted with a key derived from SECRET_KEY, so this service must
      # hold the same secret as the web service or every stored Meta token is unreadable.
      - key: SECRET_KEY
        fromService:
          type: web
          name: resmara
          envVarKey: SECRET_KEY

