  #    name: resmara-publisher
  #    runtime: docker
  #    region: virginia
  #    dockerfilePath: ./Dockerfile
  #    dockerCommand: python scripts/render_clock.py
  #    schedule: "*/15 * * * *"     # UTC, Render's cron dial is UTC
  #    plan: 0.5c-512mb             # cheapest; cron jobs have no free plan
