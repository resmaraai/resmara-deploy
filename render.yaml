# Render Blueprint — the repository is the deployment.
#
# Render reads this file, builds ./Dockerfile, wires the database connection string in, and
# deploys on every commit to the branch below. Anything marked `sync: false` is a placeholder:
# its value lives in the Render dashboard and is never written to git.
#
# ── How a sync behaves (read before linking) ─────────────────────────────────────────────
# Render's own rules, because each one is a way this file can hurt a live service:
#
#   * A resource whose `name` matches an existing one has *this file's* configuration applied to
#     it; it does not create a second copy. So the names below are load-bearing: `resmara` and
#     `resmara-db` are the live ones, created by hand in the dashboard.
#   * Every setting OMITTED from a service reverts to its DEFAULT on sync — and the defaults are
#     not what this service runs. `region` defaults to oregon and this service lives in
#     virginia; that is why repo, branch, region, plan and the Docker paths are all spelled out
#     rather than left implicit.
#   * Environment variables already on the service are PRESERVED even when they are not listed
#     here. They are listed anyway, as placeholders, so this file is a complete inventory of what
#     production needs — an omitted key here is invisible to whoever reads it next.
#   * Changing a value outside the Blueprint is overwritten by the next sync, and a deleted
#     Blueprint-managed resource is recreated by it. Neither is a disaster; both are surprises.
#
# ── Preview environments ───────────────────────────────────────────────────────────────────
# `previews` below is the declaration, not the switch: Render creates pull-request environments
# only once a Blueprint is linked to this repo (Dashboard → Blueprints → New Blueprint Instance).
# Previews require the Pro workspace plan.
#
# What a preview is, and what it therefore cannot do:
#   * a fresh copy of every service + database in this file, with its OWN EMPTY database
#     (copies of datastores do not include data) — so a preview can never read or write the live
#     database as long as the datastore is declared here as it is;
#   * `sync: false` values are NOT copied into a preview. META_CLIENT_SECRET is one of them, so a
#     preview cannot complete a Facebook login until an environment group carries it — that is a
#     deliberate trade, not a bug;
#   * the preview's web service inherits the production plan (`free`), so it sleeps and cold-
#     starts. Change `previews.plan` here if a preview needs to stay awake;
#   * `expireAfterDays: 3` deletes a preview three days after its last commit, and Render removes
#     it when the pull request closes.
#
# ── Which repository a preview builds ─────────────────────────────────────────────────────
# The `repo` below is the public mirror, `resmara-deploy`, which is what production builds today
# (`.github/workflows/deploy.yml` there calls the service's deploy hook on every push to main).
# That keeps a sync from repointing production at a different repository. It also means a
# preview, whose code comes from the pull request, only reflects this app if the Blueprint is
# linked to the repository those pull requests are opened against — `resmaraai/resmara`. Moving
# production onto that repository is a separate decision (it needs Render's GitHub app
# installed on the `resmaraai` account and retires the mirror + hook); make it in one step, not
# as a side effect of linking previews.
previews:
  generation: automatic
  expireAfterDays: 3

databases:
  - name: resmara-db
    databaseName: resmara
    user: resmara
    region: virginia       # must match the live database, or a sync tries to move it
    plan: 0.1c-256mb       # paid: free Postgres is DELETED on its expiry date (see DEPLOY.md §3b)
    ipAllowList: []        # private network only: the service reaches it, the internet does not.
                           # To connect from a laptop, add that IP in the dashboard.

services:
  - type: web
    name: resmara
    runtime: docker
    plan: starter          # paid: free web services sleep after ~15 min idle; see DEPLOY.md §3b
    region: virginia
    repo: https://github.com/resmaraai/resmara-deploy
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit   # merging to main is the deploy (autoDeploy: true is deprecated)
    # healthCheckPath is deliberately not set: the live service has none, and adding one to a
    # free instance means a restarted container that fails the check mid-migration is rolled
    # back instead of coming up. Set `/openapi.json` here when the plan is paid.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resmara-db
          property: connectionString
      - key: RESMARA_ENV
        value: production
      - key: RESMARA_PUBLIC_BASE_URL
        value: https://www.resmara.com
      - key: SECRET_KEY
        generateValue: true     # Render keeps the value already on the service; a preview gets
                                # its own. Changing it logs everybody out and orphans stored
                                # ad-account tokens (they are encrypted with a key derived from it).
      - key: RESMARA_PUBLISH_TOKEN
        generateValue: true     # the machine token: /api/admin/system-check, build-room sync,
                                # the publishing clock. Must match the service's own value; the
                                # copy used by scripts on the Mac is in the dev profile's secrets.
      # ── Meta ─────────────────────────────────────────────────────────────────────────────
      # App "Resmara" under Be Authentic Productions (verified), App ID 1135911812356864.
      # META_CLIENT_ID and META_CLIENT_SECRET are a PAIR and have to change together: a new ID
      # with the old secret answers "Error validating client secret" on every token exchange, and
      # it reads like a code bug. That is why the ID is a placeholder and not a literal — set
      # both in the dashboard, in one sitting. The old app (1881970083170197) belongs to a
      # previous setup and must not be used.
      - key: META_CLIENT_ID
        sync: false             # wanted value: 1135911812356864
      - key: META_CLIENT_SECRET
        sync: false             # Meta → App settings → Basic
      # Reading the ad account (ads_read/read_insights), managing Page ads (pages_manage_ads) and
      # Instagram insights are new with the app switch: the readiness audit and the day 7/14
      # report read all four. Keep this list in step with the app's use cases, or Meta answers
      # Invalid Scopes. A preview environment needs an environment group carrying this list.
      - key: META_SCOPES
        value: >-
          ads_management,ads_read,pages_manage_ads,read_insights,business_management,pages_read_engagement,pages_show_list,pages_manage_posts,instagram_basic,instagram_content_publish,instagram_manage_insights
      - key: META_SYSTEM_TOKEN       # our own ad spend: Marketing page + token health
        sync: false
      - key: META_AD_ACCOUNT_ID      # 16 digits, no act_ prefix
        sync: false
      - key: META_PAGE_ID            # where a Boost posts
        sync: false
      - key: META_IG_ID              # the Instagram account a post goes to
        sync: false
      - key: META_PIXEL_ID
        sync: false
      # ── Content engine ───────────────────────────────────────────────────────────────────
      # Any OpenAI-compatible endpoint. Prod runs on ollama.com (flat plan, no per-token bill);
      # unset, the engine honestly reports source="unavailable" and generates nothing.
      - key: OPENAI_API_KEY
        sync: false
      # ── Payments ─────────────────────────────────────────────────────────────────────────
      # The live Resmara account (acct_1UYo4pDOjDXzVDgN) can take money. Checkout builds its line
      # item inline, so no price id is required; the webhook secret is what makes an order paid.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_CENTS
        value: "4900"
      # ── Email ────────────────────────────────────────────────────────────────────────────
      # Render's free plan drops outbound SMTP, so Resend over HTTPS is the only sender that
      # works here. `onboarding@resend.dev` is Resend's test sender: it delivers only to the
      # Resend account owner. Verify resmara.com in Resend and change MAIL_FROM before promising
      # a confirmation, invite or reset link to anybody.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "Resmara <onboarding@resend.dev>"
      # ── Analytics / tracking ────────────────────────────────────────────
      - key: GA4_PROPERTY_ID         # numeric property, not the G- measurement id
        sync: false
      - key: GA4_MEASUREMENT_ID
        sync: false
      - key: GA4_SA_JSON             # service-account JSON; a path is also accepted
        sync: false
      - key: CLARITY_PROJECT_ID
        sync: false
      - key: CLARITY_TOKEN           # ~10 export calls per project per DAY; the app caches 6h
        sync: false
      - key: RESMARA_PAGESPEED_KEY
        sync: false
      # ── The console's own wiring ─────────────────────────────────────────────────────────
      - key: RESMARA_GITHUB_TOKEN    # Releases + build-room sync (GitHub PAT, repo scope)
        sync: false
      - key: RESMARA_RENDER_API_KEY  # Releases: what production actually serves
        sync: false
      - key: RESMARA_RENDER_SERVICE_ID
        value: srv-dbml2aei0phs73c6639g
      - key: RESMARA_ADMIN_EMAILS    # operator console = is_admin, not this list alone
        sync: false
      - key: RESMARA_SIGNUP_CODE     # shared beta invite code
        sync: false

  # ── The scheduler: created through the API, kept commented here ─────────────────────────────
  # A cron job has no free tier (~$1/month, billed from the moment the service exists). The clock
  # runs as the cron `resmara-publisher` (created through the API), every 15 minutes, and the Mac
  # LaunchAgent that used to do it is retired. This block stays commented because the service
  # already exists: a Blueprint sync that saw it here would try to buy a second one. If the job is
  # ever recreated from this file, use the same command — render_clock.py publishes, reads the
  # comments, syncs the build room, sweeps listings every sixth hour and checks Meta tokens daily.
  #
